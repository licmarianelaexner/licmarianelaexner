<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marianela Exner | Psicopedagogía y Orientación Vocacional</title>
  
  <meta name="description" content="Marianela Exner, Lic. en Psicopedagogía y Esp. en Orientación Vocacional, Laboral y Educativa.">

  <!-- Fuente Montserrat de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #ffffff;
      color: #333333;
      line-height: 1.6;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 8%;
      background-color: #ffffff;
      box-shadow: 0 1px 5px rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-header img {
      height: 55px;
      width: auto;
      display: block;
    }

    nav a {
      margin-left: 2rem;
      text-decoration: none;
      color: #4B6B75;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #7FA9B0;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1100px;
      margin: 3rem auto;
      padding: 0 2rem;
      gap: 3rem;
    }

    .hero-content {
      flex: 1;
    }

    .hero-logo-main img {
      max-width: 100%;
      width: 380px;
      height: auto;
      margin-bottom: 1.5rem;
    }

    .hero-content p {
      color: #555555;
      font-size: 1.05rem;
      font-weight: 300;
      margin-bottom: 2rem;
    }

    .cta-button {
      display: inline-block;
      padding: 0.8rem 2rem;
      background-color: #7FA9B0;
      color: #ffffff;
      text-decoration: none;
      border-radius: 30px;
      font-weight: 500;
      transition: background-color 0.3s;
    }

    .cta-button:hover {
      background-color: #4B6B75;
    }

    .hero-image {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .hero-image img {
      max-width: 100%;
      height: auto;
      max-height: 520px;
      object-fit: contain;
    }

    @media (max-width: 768px) {
      .hero {
        flex-direction: column-reverse;
        text-align: center;
      }

      nav {
        display: none;
      }

      .hero-logo-main img {
        margin: 0 auto 1.5rem auto;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo-header">
      <img src="logo.png" alt="Marianela Exner - Lic. en Psicopedagogía">
    </a>

    <nav>
      <a href="#inicio">Inicio</a>
      <a href="#sobre-mi">Sobre mí</a>
      <a href="#servicios">Servicios</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="inicio">
      <div class="hero-content">
        <div class="hero-logo-main">
          <img src="logo.png" alt="Marianela Exner - Lic. en Psicopedagogía">
        </div>

        <p>Acompañamiento psicopedagógico integral para niños, adolescentes y jóvenes en sus procesos de aprendizaje y elección vocacional.</p>
        <a href="#contacto" class="cta-button">Solicitar Consulta</a>
      </div>

      <div class="hero-image">
        <img src="logo.png" alt="Marianela Exner">
      </div>
    </section>
  </main>

</body>
</html>
